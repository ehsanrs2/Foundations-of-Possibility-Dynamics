name: B4 hidden stochastic fault policy conformance (NOT H1)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b4-belief-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hidden-fault policy focused regression
        run: python -m unittest tests.test_p1_r16e_b4_hidden_fault_policy -v
      - name: Exact belief DP and history-oracle diagnostic
        run: python -m experiments.p1_r16e_b4_hidden_fault_policy > b4-hidden-fault-results.json
      - name: Full historical scientific test regression
        run: python -m unittest discover -s tests -v
      - name: Upload synthetic diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: b4-hidden-fault-policy-results
          path: b4-hidden-fault-results.json
