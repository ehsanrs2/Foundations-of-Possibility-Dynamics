name: R8 development-only prediction baselines (NOT H1)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r8-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test R8 scopes and predictive invariants
        run: python -m unittest tests.test_p1_r8_dev_predictive_baselines -v
      - name: Compare baseline with scoped R1 on TRAIN/TUNE synthetic systems
        run: |
          mkdir -p r8-development-only
          python -m experiments.p1_r8_dev_predictive_baselines \
            --seed 20261101 --train-n 24 --tune-n 12 \
            --output r8-development-only/r8_dev_full_records.json \
            | tee r8-development-only/r8_dev_summary.json
      - name: Upload developer-only model and scoring records
        uses: actions/upload-artifact@v4
        with:
          name: r8-dev-baselines-not-h1
          path: r8-development-only/
          retention-days: 30
