name: N1 R1 information-loss retrospective (NOT H1)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  n1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_p1_r16m_n1_r1_information_audit -v
      - name: Exact retrospective diagnostic
        run: python -m experiments.p1_r16m_n1_r1_information_audit | tee n1-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: n1-development-information-audit
          path: n1-results.json
      - run: python -m unittest discover -s tests -v
