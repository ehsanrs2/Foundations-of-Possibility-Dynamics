name: Scientific book checks and artifacts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (illustrative only)
        run: python -m unittest discover -s tests -v
      - name: Manuscript integrity
        run: python scripts/check_book.py
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build readable artifacts
        run: bash scripts/build_book.sh
      - name: Upload HTML and EPUB
        uses: actions/upload-artifact@v4
        with:
          name: possibility-dynamics-book
          path: dist/
