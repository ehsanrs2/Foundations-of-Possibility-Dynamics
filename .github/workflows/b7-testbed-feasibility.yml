name: B7 independent testbed feasibility (NO field H1)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b7-feasibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dry-run structural and negative controls
        run: python -m unittest tests.test_p1_r16h_b7_testbed_feasibility -v
      - name: Reproducible B7 feasibility report
        run: python -m experiments.p1_r16h_b7_testbed_feasibility > b7-feasibility.json
      - name: Entire historical regression
        run: python -m unittest discover -s tests -v
      - name: Upload developer-only feasibility summary
        uses: actions/upload-artifact@v4
        with:
          name: b7-dry-run-evidence-gate
          path: b7-feasibility.json
