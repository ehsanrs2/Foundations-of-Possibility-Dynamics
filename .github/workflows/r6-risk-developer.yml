name: R6 developer risk law and exact full-input reference (NOT H1)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r6-development-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check R6 reference and leakage guards
        run: python -m unittest tests.test_p1_r6_fault_risk_dev -v
      - name: Execute explicit synthetic risk development audit
        run: |
          mkdir -p r6-dev-artifact
          python -m experiments.p1_r6_fault_risk_dev \
            --seed 20261031 --train-n 24 --tune-n 12 \
            --output r6-dev-artifact/r6_dev_risk_records.json \
            | tee r6-dev-artifact/r6_dev_risk_summary.json
      - name: Upload development-only records
        uses: actions/upload-artifact@v4
        with:
          name: r6-development-only-not-h1
          path: r6-dev-artifact/
          retention-days: 30
