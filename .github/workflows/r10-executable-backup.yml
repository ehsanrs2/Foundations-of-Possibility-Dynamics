name: R10 executable physical backup and Linux process caps (NOT H1)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r10-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify joint readiness and resource-limit contracts
        run: python -m unittest tests.test_p1_r10_executable_backup -v
      - name: Run six predeclared resource-capped development fixtures
        run: |
          mkdir -p r10-dev-artifact
          python -m experiments.p1_r10_executable_backup \
            --output r10-dev-artifact/r10_all_in_process_measurements.json \
            | tee r10-dev-artifact/r10_stable_summary.json
      - name: Upload bounded-run records (NOT H1 results)
        uses: actions/upload-artifact@v4
        with:
          name: r10-bounded-development-only-not-h1
          path: r10-dev-artifact/
          retention-days: 30
