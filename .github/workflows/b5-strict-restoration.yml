name: B5 strict same-history restoration and censoring (NOT H1)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b5-strict-restoration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused strict-loss, observation-lag and censoring regression
        run: python -m unittest tests.test_p1_r16f_b5_strict_restoration -v
      - name: Exact synthetic B5 audit
        run: python -m experiments.p1_r16f_b5_strict_restoration > b5-strict-restoration.json
      - name: Full historical scientific regression
        run: python -m unittest discover -s tests -v
      - name: Upload developer-only B5 summary
        uses: actions/upload-artifact@v4
        with:
          name: b5-strict-restoration-diagnostic
          path: b5-strict-restoration.json
